name: Build Documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:

env:
  # Prebuilt image with sphinx, texlive-full, xindy, lftp deps, etc.
  # It keeps CI away from installing texlive via apt on every run.
  DOCBUILDER_IMAGE: nucleisoftware/docbuilder:latest

jobs:
  build_deploy:
    name: Build documentation
    runs-on: ubuntu-22.04

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build Documentation
      run: |
        docker run --rm \
          --entrypoint bash \
          -v "$GITHUB_WORKSPACE:/nuclei/workspace" \
          -w /nuclei/workspace \
          "$DOCBUILDER_IMAGE" \
          -c 'pip3 install -U -r requirements.txt && make clean && make pdf'

    # The container usually runs as root, so build/ is owned by root afterwards.
    # Take it back for the runner user to keep later steps and cleanup simple.
    - name: Fix workspace ownership
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" build || true

    - name: Deploy Documentation
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      env:
          FTPUSER: ${{ secrets.FTPUSER }}
          FTPPWD: ${{ secrets.FTPPWD }}
          FTPSERVER: ${{ secrets.FTPSERVER }}
      run: |
        # lftp is tiny compared with texlive, install it only when missing
        if ! command -v lftp >/dev/null 2>&1 ; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
        fi
        bash .github/ftp_deploy.sh $FTPUSER $FTPPWD $FTPSERVER build/html nuclei_tools
        echo "Click https://doc.nucleisys.com/nuclei_tools to view the latest deployment!"

    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: nuclei_tools_doc
        # A file, directory or wildcard pattern that describes what to upload
        path: build/html
